services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: akevra
      POSTGRES_USER: akevra
      POSTGRES_PASSWORD: akevra
    ports:
      - "5432:5432"
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command=test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f
      -c max_wal_senders=3
      -c wal_keep_size=1GB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - walarchive:/var/lib/postgresql/archive
      - ./backups:/backups

volumes:
  pgdata:
  walarchive:
